name: Who's That? - actualizar y publicar
on:
  workflow_dispatch:
    inputs:
      copia_ahora:
        description: 'Guardar una copia cifrada antes de actualizar'
        type: boolean
        default: false
  schedule:
    - cron: '23 2 * * *'
      timezone: "Europe/Madrid"
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: whosthat-base-y-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      WHOSTHAT_DB_PASSWORD: ${{ secrets.WHOSTHAT_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validar JavaScript y pruebas de regresión
        shell: bash
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Preparar biblioteca Python
        run: python -m pip install -r requirements.txt
      - name: Validar actualización de base Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Comprobar configuración
        shell: bash
        run: |
          test -n "$WHOSTHAT_DB_PASSWORD" || { echo 'Configura WHOSTHAT_DB_PASSWORD en Secrets.'; exit 1; }
          gh release view whosthat-data >/dev/null || { echo 'Falta el Release whosthat-data con la base de fechas relativas.'; exit 1; }
      - name: Recuperar base cifrada persistente desde Releases
        run: gh release download whosthat-data --pattern 'whosthat.db.gz.enc' --dir data
      - name: Verificar integridad de la base cifrada publicada
        shell: bash
        run: |
          gh release download whosthat-data --pattern 'version.json' --dir data --clobber
          python -m scripts.validar_release data
      - name: Comprobar copia semanal
        id: copia
        shell: bash
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.copia_ahora }}" = "true" ]; then
            echo "guardar=true" >> "$GITHUB_OUTPUT"
            echo "fecha=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Guardar copia semanal cifrada (30 días)
        if: steps.copia.outputs.guardar == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: whosthat-backup-${{ steps.copia.outputs.fecha }}
          path: |
            data/whosthat.db.gz.enc
            data/version.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Conservar solo las dos últimas copias
        if: steps.copia.outputs.guardar == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("whosthat-backup-"))) | [.created_at, (.id | tostring)] | @tsv' | sort -r | tail -n +3 | cut -f2 | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done
      - name: Actualizar cambios horarios sin perder la secuencia
        run: python scripts/actualizar_y_publicar.py --workers 4
      - name: Publicar nueva base cifrada como asset de Release
        shell: bash
        run: |
          inicio=$SECONDS
          gh release upload whosthat-data data/whosthat.db.gz.enc data/version.json --clobber
          echo "TIEMPO PUBLICACIÓN RELEASE: $((SECONDS - inicio)) s"
      - name: Preparar sitio estático (sin scripts de gestión ni ficheros privados)
        shell: bash
        run: |
          mkdir -p _site/css _site/js _site/data
          cp index.html _site/
          cp css/*.css _site/css/
          cp js/*.js _site/js/
          cp data/whosthat.db.gz.enc data/version.json _site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
