name: Publicar sitio al cambiar main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: whosthat-base-y-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar web y descargar base cifrada publicada
        shell: bash
        run: |
          mkdir -p _site/css _site/js _site/data
          cp index.html _site/
          cp css/*.css _site/css/
          cp js/*.js _site/js/
          gh release download whosthat-data --pattern 'whosthat.db.gz.enc' --dir _site/data
          gh release download whosthat-data --pattern 'version.json' --dir _site/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
